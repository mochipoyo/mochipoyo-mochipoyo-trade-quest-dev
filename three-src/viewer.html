<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>3Dモデル・アニメーション確認</title>
<style>
  html, body { margin: 0; height: 100%; background: #10141f; color: #e8e8f0; font: 13px/1.5 "Hiragino Sans","Noto Sans JP",sans-serif; overflow: hidden; }
  #ui { position: absolute; left: 10px; top: 10px; background: rgba(10,14,28,.88); border: 1px solid #e8c15a; border-radius: 6px; padding: 8px 10px; max-width: 360px; }
  #ui select, #ui button { font: inherit; margin: 2px; background: #1c2440; color: #fff; border: 1px solid #5a6a9a; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  #ui button.on { background: #e8c15a; color: #111; }
  #info { color: #aab4d0; font-size: 12px; margin-top: 4px; white-space: pre-line; }
  canvas { display: block; }
</style>
</head>
<body>
<div id="ui"><div><b>3Dモデル・アニメーション確認</b></div>
<div><select id="model"></select></div><div id="anims"></div><div id="info"></div></div>
<script type="module" src="/src/viewer.js"></script>
</body>
</html>
