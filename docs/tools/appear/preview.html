<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>装備の外見の確かめ（開発用）</title>
<!-- 開発用の確かめのページ（ゲームからはリンクしない）。?actors=hero,lina&views=front,back&sets=0,1,2&k=1 -->
<style>
body { background: #3a4152; color: #eee; font: 12px system-ui, sans-serif; margin: 8px; }
table { border-collapse: collapse; } td { padding: 2px; vertical-align: bottom; text-align: center; }
canvas { image-rendering: pixelated; display: block; background: #5b6476; }
th { font-weight: normal; color: #cfd6e4; padding: 2px 6px; }
</style>
<script>window.Assets = { base: '../../../' };</script>
<script src="../../../js/data/item-icon-manifest.js"></script>
<script src="../../../js/data/equip-appearance-data.js"></script>
<script src="../../../js/data/equip-anchors.js"></script>
<script src="../../../js/rpg/equipment-appearance.js"></script>
<body>
<div id="out"></div>
<script>
(async function () {
  const q = new URLSearchParams(location.search);
  const items = await (await fetch('preview-items.json')).json(); window.ITEMS = items;
  const sets = JSON.parse(q.get('setsJson') || 'null') || [{}, { weapon: 'steel_sword', armor: 'iron_armor', shield: 'iron_shield', head: 'iron_helm', acc: 'ring_power' }, { weapon: 'iron_spear', armor: 'robe', head: 'wizard_hat', acc: 'amulet_life' }, { weapon: 'hunter_bow', armor: 'leather_armor', shield: 'dow_buckler', head: 'leather_cap', acc: 'necklace_skip' }, { weapon: 'mage_staff', armor: 'chain_mail', shield: 'ironcastle_shield', head: 'mentor_crown', acc: 'glasses_htf' }, { weapon: 'b19_crossroads_blade', armor: 'b19_dark_matter_veil', shield: 'b19_unsmiling_aegis', head: 'bu_gull_admiral_hat', acc: 'b19_silent_bell' }, { weapon: 'battle_axe', armor: 'dragon_mail', shield: 'wooden_shield', head: 'dragon_helm', acc: 'bracelet_reverse' }, { weapon: 'tiger_claw', armor: 'star_cloak', head: 'sand_turban', acc: 'vol_earring' }, { weapon: 'macd_twin', armor: 'sea_coat', head: 'icecrystal_hood', acc: 'star_compass' }, { weapon: 'margin_hammer', armor: 'b19_porcelain_robe', shield: 'mana_barrier_shield', head: 'bu_control_seal_circlet', acc: 'td_session_watch' }];
  const pick = (q.get('sets') || '').split(',').filter(Boolean).map(Number); const S = pick.length ? pick.map((i) => sets[i]) : sets;
  const T = window.EQUIP_ANCHORS.actors; const actors = (q.get('actors') || Object.keys(T).join(',')).split(','); const views = (q.get('views') || 'front,back,left,right').split(','); const k = Number(q.get('k') || 1);
  const EA = window.EquipmentAppearance; EA.setMode(q.get('mode') === 'pixel' ? 'pixel' : 'vector'); let html = '<table>';   // v9.7：この見本は v9.6 の描き足し（vector）。?mode=pixel でドット絵の差分（部品のある主人公の向きだけ）
  const jobs = []; for (const a of actors) for (const v of views) if (T[a] && T[a].views[v]) jobs.push([a, v]);
  for (const [a, v] of jobs) { html += '<tr><th>' + a + '<br>' + v + '</th>' + S.map((_, i) => '<td><canvas id="c_' + a + '_' + v.replace(':', '_') + '_' + i + '"></canvas></td>').join('') + '</tr>'; }
  document.getElementById('out').innerHTML = html + '</table>';
  for (const [a, v] of jobs) {
    for (let i = 0; i < S.length; i++) {
      const actor = { id: a, job: v.startsWith('job:') ? v.slice(4) : 'warrior', equip: S[i] };
      const r = await EA.composeFor(actor, v); const c = document.getElementById('c_' + a + '_' + v.replace(':', '_') + '_' + i);
      if (r.state !== 'ok') { c.width = 40; c.height = 40; continue; }
      const src = EA.cropOpaque(r.canvas, 2); c.width = src.width * k; c.height = src.height * k; const g = c.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(src, 0, 0, c.width, c.height);
    }
  }
  document.body.setAttribute('data-done', '1');
})().catch((e) => { document.body.setAttribute('data-done', 'err'); document.getElementById('out').textContent = 'ERR ' + e.stack; });
</script>
</body>
</html>
